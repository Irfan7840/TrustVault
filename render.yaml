services:
  - type: web
    name: trustvault
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:$PORT 'trustvault:create_app(\"production\")'"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/storage/documents

databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault
    plan: free
